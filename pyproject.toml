[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unofficial-zaptec-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Zaptec EV chargers (status, history, pause/resume, available current). Not affiliated with Zaptec AS."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Holger Könemann" }]
keywords = ["mcp", "zaptec", "ev-charger", "wallbox", "home-automation", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "pytest-cov",
  "ruff>=0.5",
  "mypy>=1.8",
]

[project.scripts]
unofficial-zaptec-mcp = "zaptec_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/holger1411/unofficialzaptecMCP"
Issues = "https://github.com/holger1411/unofficialzaptecMCP/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zaptec_mcp_server = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
markers = [
  "integration: live API tests, requires credentials, opt in via -m integration",
]
# Live tests are skipped by default; `pytest -m integration` overrides this -m.
addopts = "-q --strict-markers -m 'not integration'"
